  <ellipse cx="27" cy="16" rx="3.5" ry="2" fill="#F7F4F9" transform="rotate(15 27 16)" />

  <!-- Muzzle Shadow -->
  <path d="M 14,29.5 C 14,25.5 16.5,24.5 20,24.5 C 23.5,24.5 26,25.5 26,29.5 C 26,33.5 23,35 20,35 C 17,35 14,33.5 14,29.5 Z" fill="#B2ABB8" />

  <!-- Muzzle Main -->
