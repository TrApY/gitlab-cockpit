  <!-- Cheek Shadows Left -->
  <circle cx="5" cy="23" r="4.5" fill="#78707D"/>
  <circle cx="8" cy="26" r="4" fill="#78707D"/>
  <circle cx="12" cy="28" r="3" fill="#78707D"/>

  <!-- Cheek Shadows Right -->
  <circle cx="35" cy="23" r="4.5" fill="#78707D"/>
  <circle cx="32" cy="26" r="4" fill="#78707D"/>
  <circle cx="28" cy="28" r="3" fill="#78707D"/>

  <!-- Head Base Main -->
  <ellipse cx="20" cy="21" rx="16" ry="13" fill="#918996" />

