  <path d="M 31.5,14.5 C 32,11.5 30.5,8.5 28,9.5 C 27,10 26.5,11.5 26.5,14 Z" fill="#F7F4F9"/>

  <!-- Head Base Shadow (Creates 1px bottom/side border) -->
