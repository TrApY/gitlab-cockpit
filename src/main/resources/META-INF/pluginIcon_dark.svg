  <path d="M 33.5,15.5 C 35,10 32,5 27,7 C 25,8 24,11 24.5,14 Z" fill="#78707D"/>

  <!-- Outer Ears Main -->
  <path d="M 7.5,15 C 6.5,10.5 8.5,6.5 12.5,8 C 14,8.5 15,11 14.5,14 Z" fill="#918996"/>
  <path d="M 32.5,15 C 33.5,10.5 31.5,6.5 27.5,8 C 26,8.5 25,11 25.5,14 Z" fill="#918996"/>

  <!-- Inner Ears -->
