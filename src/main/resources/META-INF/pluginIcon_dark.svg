  <circle cx="27" cy="23" r="2.4" fill="#D98A2C" />
  <circle cx="26.7" cy="23" r="1.6" fill="#262329" />
  <circle cx="27.2" cy="22.2" r="0.6" fill="#FFFFFF" />
  <circle cx="25.8" cy="23.5" r="0.3" fill="#FFFFFF" />

  <!-- GitLab Merge-Commit Node Badge (Bottom Right) -->
  <!-- Badge Shadow (Flat drop shadow for depth) -->
  <circle cx="32.5" cy="33.5" r="7" fill="#78707D" />
  
  <!-- Badge White Base -->
  <circle cx="32.5" cy="32.5" r="7" fill="#FFFFFF" />
  
  <!-- Badge Green Core -->
  <circle cx="32.5" cy="32.5" r="5.5" fill="#4CAF50" />
  
  <!-- Merge Icon Paths (Strictly solid white fills, no strokes) -->
  <path d="M 30.5,29.5 L 31.5,29.5 L 31.5,31.5 L 33.5,33.5 L 32.8,34.2 L 31.5,32.9 L 31.5,35.5 L 30.5,35.5 Z" fill="#FFFFFF" />
  <circle cx="31" cy="29.5" r="1.4" fill="#FFFFFF" />
  <circle cx="31" cy="35.5" r="1.4" fill="#FFFFFF" />
  <circle cx="33.2" cy="33.8" r="1.4" fill="#FFFFFF" />

</svg>