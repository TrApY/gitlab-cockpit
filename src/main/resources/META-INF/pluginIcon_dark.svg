  <circle cx="13" cy="23" r="2.4" fill="#D98A2C" />
  <circle cx="13.3" cy="23" r="1.6" fill="#262329" />
  <circle cx="13.8" cy="22.2" r="0.6" fill="#FFFFFF" />
  <circle cx="12.4" cy="23.5" r="0.3" fill="#FFFFFF" />

