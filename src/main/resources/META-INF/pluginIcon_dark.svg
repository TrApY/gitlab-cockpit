  <circle cx="6" cy="22" r="4" fill="#918996"/>
  <circle cx="9" cy="25.5" r="3.5" fill="#918996"/>
  <circle cx="12.5" cy="27.5" r="2.5" fill="#918996"/>

  <!-- Cheek Main Right -->
