<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Two branches merging into a node inside a hexagon">
  <!-- hexagon container -->
  <polygon points="35,20 27.5,33 12.5,33 5,20 12.5,7 27.5,7" fill="none" stroke="#E8833A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- branch A -->
  <path d="M14 15 C 14 23, 20 22, 20 28" fill="none" stroke="#4C86C6" stroke-width="2.4" stroke-linecap="round"/>
  <!-- branch B -->
  <path d="M26 15 C 26 23, 20 22, 20 28" fill="none" stroke="#E8833A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- source nodes -->
  <circle cx="14" cy="15" r="2.5" fill="#4C86C6"/>
  <circle cx="26" cy="15" r="2.5" fill="#E8833A"/>
  <!-- merge node -->
  <circle cx="20" cy="28" r="3" fill="#46A65C"/>
</svg>
