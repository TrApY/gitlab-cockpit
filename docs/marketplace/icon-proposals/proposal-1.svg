<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Cockpit gauge with a git branch as the needle">
  <!-- gauge dome -->
  <path d="M6 27 A14 14 0 0 1 34 27" fill="none" stroke="#E8833A" stroke-width="3.4" stroke-linecap="round"/>
  <!-- needle (branch trunk) -->
  <line x1="20" y1="27" x2="20" y2="16" stroke="#46A65C" stroke-width="2.8" stroke-linecap="round"/>
  <!-- branch fork -->
  <line x1="20" y1="22" x2="28" y2="18" stroke="#4C86C6" stroke-width="2.4" stroke-linecap="round"/>
  <!-- commit nodes -->
  <circle cx="20" cy="16" r="2.7" fill="#46A65C"/>
  <circle cx="28" cy="18" r="2.4" fill="#4C86C6"/>
  <!-- pivot hub -->
  <circle cx="20" cy="27" r="2.7" fill="#CC6B2E"/>
</svg>
